---
- name: Asegurar que el volumen tenga sistema de archivos ext4
  community.general.filesystem:
    fstype: ext4
    dev: "{{ ebs_device }}"
    # force: evita formatear si ya hay datos (Vital para persistencia)
    force: no

- name: Crear el directorio de montaje para Jenkins
  file:
    path: "{{ mount_point }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: '0755'

- name: Montar el volumen EBS y persistir en fstab
  ansible.posix.mount:
    path: "{{ mount_point }}"
    src: "{{ ebs_device }}"
    fstype: ext4
    opts: defaults
    state: mounted
