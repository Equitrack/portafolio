---
- name: Asegurar que el directorio de datos tenga los permisos correctos (UID 1000)
  file:
    path: "{{ mount_point }}"
    owner: "1000"
    group: "1000"
    state: directory
    recurse: yes

- name: Levantar el contenedor oficial de Jenkins LTS
  community.docker.docker_container:
    name: jenkins
    image: jenkins/jenkins:lts
    state: started
    restart_policy: always
    published_ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - "{{ mount_point }}:/var/jenkins_home"
